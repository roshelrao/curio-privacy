<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curily</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #FAF6F0;
    --fg: #17130F;
    --muted: #6b6258;
    --rule: #e5ddd0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17130F;
      --fg: #FAF6F0;
      --muted: #a89d8e;
      --rule: #33291f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 64px 20px 80px;
    text-align: center;
  }
  h1 {
    font-size: 1.8em;
    margin-bottom: 8px;
  }
  p {
    color: var(--muted);
    margin-bottom: 2em;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  a.link-card {
    display: block;
    border: 1px solid var(--rule);
    border-radius: 12px;
    padding: 16px;
    color: inherit;
    text-decoration: none;
    font-weight: 600;
  }
</style>
</head>
<body>
<main>
  <h1>Curily</h1>
  <p>Turn curiosity into a daily habit.</p>
  <div class="links">
    <a class="link-card" href="/privacy.html">Privacy Policy</a>
    <a class="link-card" href="/support.html">Support</a>
  </div>
</main>
</body>
</html>
